name: Test error when no Terraform version constraint found
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create an empty directory with no .tf files
      - name: Create empty test directory
        run: mkdir -p /tmp/empty-tf-dir

      # The action should fail when no version constraint is found
      - id: action
        uses: .
        with:
          directory: /tmp/empty-tf-dir
        continue-on-error: true

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no .tf files found, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when no Terraform version constraint found"
