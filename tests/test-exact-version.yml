name: Test exact version constraint
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Terraform versions file with exact version constraint
        run: |
          mkdir -p tests/fixtures/exact-version
          cat > tests/fixtures/exact-version/versions.tf << 'EOF'
          terraform {
            required_version = "= 1.5.0"
          }
          EOF

      - id: action
        uses: .
        with:
          directory: tests/fixtures/exact-version

      - name: Assert minVersion equals 1.5.0
        env:
          MIN: ${{ steps.action.outputs.minVersion }}
        run: |
          echo "minVersion: $MIN"
          if [ "$MIN" != "1.5.0" ]; then
            echo "FAIL: expected minVersion to be '1.5.0', got: $MIN"
            exit 1
          fi
          echo "PASS: minVersion=$MIN"

      - name: Assert maxVersion equals minVersion for exact constraint
        env:
          MIN: ${{ steps.action.outputs.minVersion }}
          MAX: ${{ steps.action.outputs.maxVersion }}
        run: |
          echo "minVersion: $MIN"
          echo "maxVersion: $MAX"
          # For an exact version, the action sets maxVersion = minVersion
          if [ "$MAX" != "$MIN" ]; then
            echo "FAIL: expected maxVersion ($MAX) to equal minVersion ($MIN) for exact constraint"
            exit 1
          fi
          echo "PASS: minVersion=maxVersion=$MIN (exact version constraint)"
