name: Test default directory usage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create Terraform file in workspace root
        run: |
          cat > "$GITHUB_WORKSPACE/versions.tf" <<'EOF'
          terraform {
            required_version = ">= 1.3.0, < 1.7.0"
          }
          EOF

      - id: action
        uses: .
        # No directory input — uses default '.'

      - name: Assert minVersion is set and non-empty
        env:
          MIN: ${{ steps.action.outputs.minVersion }}
        run: |
          echo "minVersion: $MIN"
          if [ -z "$MIN" ]; then
            echo "FAIL: minVersion is empty"
            exit 1
          fi
          echo "PASS: minVersion=$MIN"

      - name: Assert maxVersion is set and non-empty
        env:
          MAX: ${{ steps.action.outputs.maxVersion }}
        run: |
          echo "maxVersion: $MAX"
          if [ -z "$MAX" ]; then
            echo "FAIL: maxVersion is empty"
            exit 1
          fi
          echo "PASS: maxVersion=$MAX"

      - name: Assert minVersion is at least 1.3.0
        env:
          MIN: ${{ steps.action.outputs.minVersion }}
        run: |
          echo "minVersion: $MIN"
          LOWER=$(printf '%s\n1.3.0\n' "$MIN" | sort -V | head -n1)
          if [ "$LOWER" != "1.3.0" ]; then
            echo "FAIL: minVersion ($MIN) should be >= 1.3.0"
            exit 1
          fi
          echo "PASS: minVersion >= 1.3.0"

      - name: Assert maxVersion is below 1.7.0
        env:
          MAX: ${{ steps.action.outputs.maxVersion }}
        run: |
          echo "maxVersion: $MAX"
          MAJOR=$(echo "$MAX" | cut -d. -f1)
          MINOR=$(echo "$MAX" | cut -d. -f2)
          if [ "$MAJOR" -gt 1 ] || { [ "$MAJOR" -eq 1 ] && [ "$MINOR" -ge 7 ]; }; then
            echo "FAIL: maxVersion ($MAX) should be < 1.7.0"
            exit 1
          fi
          echo "PASS: maxVersion is below 1.7.0"

      - name: Cleanup Terraform file
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/versions.tf"
