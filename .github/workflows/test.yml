name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  collectInputs:
    name: Collect workflow inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      directories: ${{ steps.dirs.outputs.directories }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Get root directories
        id: dirs
        uses: clowdhaus/terraform-composite-actions/directories@26118b78561fb44052ce9ab6c5ab850df70b9aa0 # v1.13.0

  preCommit:
    name: Pre-commit
    needs: collectInputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        directory: ${{ fromJson(needs.collectInputs.outputs.directories) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Terraform min/max versions
        id: minMax
        uses: ./
        with:
          directory: ${{ matrix.directory }}

      # Min version
      - name: Remove default Terraform
        run: rm -rf $(which terraform)

      - name: Install Terraform ${{ steps.minMax.outputs.minVersion }}
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ steps.minMax.outputs.minVersion }}

      - name: Terraform validate ${{ steps.minMax.outputs.minVersion }}
        working-directory: ${{ matrix.directory }}
        run: |
          terraform init
          terraform validate

      # Max version
      - name: Remove min Terraform
        run: rm -rf $(which terraform)

      - name: Install Terraform ${{ steps.minMax.outputs.maxVersion }}
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ steps.minMax.outputs.maxVersion }}

      - name: Terraform validate ${{ steps.minMax.outputs.maxVersion }}
        working-directory: ${{ matrix.directory }}
        run: |
          terraform init
          terraform validate
